appId: com.markany.app
productName: MarkAny
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - "!**/__pycache__"
  - "!**/*.pyc"

extraResources:
  - from: src/python/dist/
    to: python-backend/
    filter:
      - "markany-backend*"
      - "!markany-backend.spec"
  - from: src/python/tesseract-portable
    to: python-backend/tesseract
    filter:
      - "**/*"
  - from: src/python/
    to: python-source/
    filter:
      - "converters/*.py"
      - "utils/*.py"
      - "requirements.txt"
      - "!**/__pycache__"
      - "!**/*.pyc"
      - "!dist/**"
      - "!build/**"
      - "!tesseract-portable/**"
      - "!*.spec"

win:
  target:
    - target: nsis
      arch:
        - x64
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MarkAny

mac:
  target:
    - target: dmg
      arch:
        - arm64
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: ${productName}-${version}-mac.${ext}

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

asar: true
